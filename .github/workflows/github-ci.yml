name: Build ros2 package (GitHub runners)

# Builds the ros2 Debian package on GitHub's own ARM64 runners and publishes it
# to Vulcan.
#
# This is the edgematic-studio pattern: build wherever, publish to Vulcan. It
# needs no runner-fleet onboarding -- only the artifact namespace and publisher
# role, which any Vulcan publisher needs regardless of where it builds.
#
# It exists alongside vulcan-ci.yml, which builds on a self-hosted Vulcan
# runner. Whichever proves out can become the only one.
#
# The known risk is disk: GitHub's public ubuntu-24.04-arm runners carry ~14 GB
# free, and a full ROS 2 source tree is not obviously smaller than that. The
# free-space step and the df reporting below exist to find out.

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      vulcan_env:
        description: Vulcan store to publish to. Blank uses the VULCAN_ENV repo variable, then stg.
        required: false
        default: ""
        type: choice
        options: ["", "stg", "prod"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    name: Build ros2 deb (arm64)
    runs-on: ubuntu-24.04-arm
    # GitHub's ceiling is 360. If the build needs more than this, that is the
    # argument for the Vulcan runner.
    timeout-minutes: 350
    outputs:
      version: ${{ steps.build.outputs.version }}
      deb: ${{ steps.build.outputs.deb }}

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # packaging/build-ros2-deb.sh derives the version from `git describe`.
          # A shallow clone would make every build 0~untagged.
          fetch-depth: 0
          fetch-tags: true

      - name: Reclaim disk
        run: |
          set -euo pipefail
          echo "before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "after:"; df -h /

      # The staged tree depends only on ros2.repos, the build dependencies and
      # the Dockerfile. None of those change when the packaging script is being
      # fixed, so cache it: a packaging-only change then costs about three
      # minutes instead of thirty-five.
      - name: Restore the staged ROS 2 tree
        id: stage-cache
        uses: actions/cache@v4
        with:
          path: stage.tar
          key: ros2-stage-${{ hashFiles('ros2.repos', 'packaging/build-depends.txt', 'packaging/Dockerfile.build') }}

      - name: Unpack the cached tree
        if: steps.stage-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          mkdir -p .build
          sudo tar -xf stage.tar -C .build
          echo "SKIP_COLCON=1" >> "${GITHUB_ENV}"
          du -sh .build/stage

      - name: Build the container
        run: |
          set -euo pipefail
          docker build \
            --file packaging/Dockerfile.build \
            --tag ros2-build:${GITHUB_SHA} \
            .
          df -h /

      - name: Build the package
        id: build
        run: |
          set -euo pipefail

          # The checkout is owned by the runner user while the container runs
          # as root, so git would reject the repository as "dubious ownership"
          # and every version would silently fall back to 0~untagged.
          docker run --rm \
            --volume "${PWD}:/workspace" \
            --workdir /workspace \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            --env SKIP_COLCON="${SKIP_COLCON:-}" \
            ros2-build:${GITHUB_SHA} \
            packaging/build-ros2-deb.sh

          deb="$(find dist -name 'ros2_*.deb' -print -quit)"
          test -n "${deb}" || { echo "No package was produced." >&2; exit 1; }

          version="$(docker run --rm -v "${PWD}:/workspace" -w /workspace \
            ros2-build:${GITHUB_SHA} dpkg-deb --field "${deb}" Version)"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "deb=${deb}"         >> "${GITHUB_OUTPUT}"
          df -h /

      - name: Pack the staged tree for the cache
        if: steps.stage-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo tar -cf stage.tar -C .build stage
          ls -lh stage.tar

      - name: Drop the build tree before uploading
        # .build holds the colcon workspace; only dist/ is wanted from here on.
        # sudo because the build ran as root inside the container, so the tree
        # is root-owned and the runner user cannot remove it.
        run: sudo rm -rf .build && df -h /   # stage.tar lives outside .build

      - name: Make the package readable by the runner user
        # dist/ is root-owned for the same reason; upload-artifact runs as the
        # runner user.
        run: sudo chown -R "$(id -u):$(id -g)" dist && ls -l dist

      - name: Add sima-cli package metadata
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet sima-cli

          cp packaging/install-package.sh dist/

          # --name ros2 with the artifact published at the root of the commit
          # prefix is what makes the install target a bare "ros2".
          SIMA_CLI_CHECK_FOR_UPDATE=0 .venv/bin/sima-cli packages build dist \
            --name ros2 \
            --version "${{ steps.build.outputs.version }}" \
            --description "ROS 2 Jazzy for Modalix, including the SiMa rosbag2 fork" \
            --install-script install-package.sh \
            --host-platform linux \
            --host-arch arm64 \
            --board-platform modalix

          cat dist/metadata.json

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ros2-deb-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  test-install:
    name: Install the package in clean bookworm
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      # Needed for packaging/smoke-test.sh; the artifact carries only the deb.
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: ros2-deb-arm64
          path: dist

      - name: Install and smoke-test
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/dist:/dist:ro" \
            --volume "${PWD}/packaging:/packaging:ro" \
            debian:bookworm /packaging/smoke-test.sh

  resolve-config:
    name: Resolve Vulcan config
    needs: test-install
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ inputs.vulcan_env || vars.VULCAN_ENV || 'stg' }}

  publish:
    name: Publish to Vulcan
    # build -> test -> publish. The house guide is explicit that publishing an
    # untested artifact is wrong, so test-install gates this.
    needs:
      - build
      - test-install
      - resolve-config
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: sima-neat/.github/.github/workflows/vulcan-publish-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-config.outputs.aws_region }}
      environment_name: ${{ needs.resolve-config.outputs.vulcan_env }}
      bucket: ${{ needs.resolve-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-config.outputs.artifact_kms_key_id }}
      cloudfront_distribution_id: ${{ needs.resolve-config.outputs.artifact_cloudfront_distribution_id }}
      # Root of the commit prefix, so the install target is "ros2" rather
      # than "ros2/arm64".
      artifact_folder: "."

      artifact_pattern: ros2-deb-arm64
      artifact_glob: "*"
      min_artifact_count: 3
      publish_manifest: true
      cleanup_github_artifacts: true

  promote-latest:
    name: Promote latest.tag
    needs:
      - resolve-config
      - publish
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-update-latest-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-config.outputs.aws_region }}
      environment_name: ${{ needs.resolve-config.outputs.vulcan_env }}
      bucket: ${{ needs.resolve-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-config.outputs.artifact_kms_key_id }}
      artifact_folder: "."

      validate_manifest: true

# edgematic-studio additionally runs a `verify-published` job between publish
# and promote-latest, reinstalling from the CDN through sima-cli. Left out here
# because vulcan-publish-artifacts exposes no outputs, so the published URL
# would have to be reconstructed -- and the branch segment is percent-encoded
# once for the S3 key and again for the viewer path, which is easy to get
# wrong. Worth adding once a real publish shows the actual URL. The publish
# workflow does run its own CloudFront verification internally.
