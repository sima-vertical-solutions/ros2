name: Vulcan runner probe

# Throwaway diagnostic. Answers the questions the ros2 build design depends on:
# what the runner actually is, how much CPU/RAM/disk it has, whether we can run
# our own eLxr container on it, and whether the SiMa apt repositories are
# reachable from inside one. Delete once the real build workflow lands.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

jobs:
  resolve-config:
    name: Resolve Vulcan config
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@agent/vertical-solutions-staging
    with:
      vulcan_env: stg

  probe:
    name: Probe ARM64 runner
    needs: resolve-config
    uses: sima-neat/.github/.github/workflows/vulcan-build.yml@agent/vertical-solutions-staging
    with:
      vulcan_env: stg
      # Barebones: a plain linux/arm64 machine. The `sdk` profile would also
      # request sdk-build and sdk-latest, pinning us to a Neat SDK snapshot
      # this build has no use for -- it runs in our own Debian container.
      runner_profile: ubuntu
      capacity: default
      ensure_sdk_container: false
      artifact_name: ros2-runner-probe
      artifact_path: _probe/*
      artifact_retention_days: 3
      build_command: |
        set -euo pipefail
        mkdir -p _probe
        exec > >(tee _probe/runner.txt) 2>&1

        echo "== identity =="
        echo "repository = ${GITHUB_REPOSITORY}"
        echo "ref        = ${GITHUB_REF}"
        echo "runner     = ${RUNNER_NAME:-unknown}"

        echo
        echo "== machine =="
        echo "arch     = $(uname -m)"
        echo "kernel   = $(uname -r)"
        echo "os       = $(. /etc/os-release && echo "${PRETTY_NAME}")"
        echo "cpus     = $(nproc)"
        echo "mem      = $(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)"

        echo
        echo "== disk (the ros2 tree is large) =="
        df -h . /mnt/vulcan 2>/dev/null || df -h .

        echo
        echo "== docker =="
        docker --version
        docker info --format 'storage={{.Driver}} root={{.DockerRootDir}}'

        echo
        echo "== can we run an arm64 bookworm container, and reach the apt repos from it? =="
        docker run --rm debian:bookworm bash -euo pipefail -c '
          echo "container arch = $(uname -m)"
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates wget >/dev/null
          for url in \
              https://mirror.elxr.dev/elxr/dists/aria/Release \
              https://repo.sima.ai/elxr/deb/release/dists/bookworm/Release; do
            if wget -q --spider --timeout=20 "${url}"; then
              echo "reachable   ${url}"
            else
              echo "UNREACHABLE ${url}"
            fi
          done
        '
